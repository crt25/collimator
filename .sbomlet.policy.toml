# --- ScanCode misdetection / dual-license corrections ----------------------
# Cases where the in-depth scan over-detected licenses from bundled fixture or
# vendored files, or picked the wrong variant; each expression is the package's
# real license as confirmed against its own metadata and license files.

[[clarify]]
package = { name = "typing-extensions", version = "4.15.0" }
expression = "PSF-2.0"
reason = "typing-extensions is licensed PSF-2.0 (Python Software Foundation License). The in-depth scan over-detected 0BSD, BSD-3-Clause, GPL-1.0-or-later and Python-2.0 from license references in bundled/fixture files, none of which is the package's own license. I pin the actual PSF-2.0."

[[clarify]]
package = { name = "json-schema", version = "0.4.0" }
expression = "AFL-3.0 OR BSD-3-Clause"
reason = "json-schema@0.4.0 is dual-licensed AFL-3.0 OR BSD-3-Clause (the New BSD License), a choice of either. The scan AND-joined AFL-2.1, AFL-3.0 and BSD-3-Clause; the registry flattened it to (AFL-2.1 OR BSD-3-Clause) with the wrong AFL version. I record the correct dual-license."

[[clarify]]
package = { name = "jszip", version = "3.10.1" }
expression = "MIT OR GPL-3.0-or-later"
reason = "jszip is dual-licensed MIT OR GPL-3.0-or-later (choice of either). The in-depth scan found the dual-license texts but added a stray GPL-1.0-or-later reference and mechanically AND-joined them. I adopt the declared choice-of-license."

[[clarify]]
package = { name = "pywin32", version = "311" }
expression = "PSF-2.0 AND BSD-3-Clause AND Python-2.0"
reason = "pywin32 genuinely bundles multiple licenses: the dist-info METADATA declares PSF; the vendored win32/, win32com/ and Pythonwin/ license.txt files are BSD-3-Clause (Mark Hammond / Greg Stein); and bundled Python components carry Python-2.0. I record the full set actually present rather than the registry's PSF-only summary."

