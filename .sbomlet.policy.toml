[document]
title = "Collimator — Third-Party Licenses"

# apps/scratch is distributed under AGPL-3.0, so in-family copyleft
# dependencies within that workspace impose no additional obligation.
[[workspace.copyleft_suppressed]]
path = "apps/scratch"
license = "AGPL-3.0-only"
description = "apps/scratch and its scratch-editor submodule are distributed under AGPL-3.0-only; the bundled scratch-* AGPL dependencies are in-family copyleft and impose no additional obligations within this workspace."

# Production occurrences always gate. Keep incomplete metadata and
# development/build-time dependencies visible without blocking initially.
[unknown]
handling = "warn"

[dev_dependencies]
handling = "warn"

[os_dependencies]
handling = "warn"

[[compatible]]
  match = "license"
  pattern = "MPL-2.0"
  reason = "MPL-2.0 dependencies have been reviewed and accepted."

# evidence: jinja2-ansible-filters is required only by copier (see
# copier-9.11.3.dist-info/METADATA in the apps/jupyter venv), the project
# templating tool used to scaffold/update the JupyterLite site. It runs at
# build time only; no GPL code from it ships in the built static site, so
# the GPL-3.0-or-later obligation does not attach to the distributed work.
[[compatible]]
match = "package"
name = "jinja2-ansible-filters"
version = "1.3.2"
where = ["apps/jupyter"]
reason = "GPL-3.0-or-later Jinja filter library pulled in solely by copier, the build-time project-templating tool for the JupyterLite site in apps/jupyter. It executes during the site build only; none of its code is distributed in the built artifact, so the copyleft obligation does not extend to the shipped work."

# --- ScanCode AND-vs-OR corrections ----------------------------------------
# Each package below declares a dual-license (a choice of EITHER license) in its
# registry metadata. The in-depth ScanCode pass finds both bundled license texts
# and mechanically joins them with AND (it cannot infer the OR); we adopt the
# declared choice-of-license. Versions are pinned so a future upstream relicense
# reopens the package for review instead of silently inheriting this override.

[[clarify]]
package = { name = "amdefine", version = "1.0.1" }
expression = "BSD-3-Clause OR MIT"
reason = "The registry declares amdefine's dual-license (BSD-3-Clause OR MIT), a choice of either. The in-depth scan found both bundled license texts and mechanically joined them with AND. I adopt the declared choice-of-license."

[[clarify]]
package = { name = "atob", version = "2.1.2" }
expression = "MIT OR Apache-2.0"
reason = "The registry declares atob's dual-license (MIT OR Apache-2.0), a choice of either. The in-depth scan found both bundled license texts and mechanically joined them with AND. I adopt the declared choice-of-license."

