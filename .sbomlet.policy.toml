reason = "python-dateutil is dual-licensed Apache-2.0 OR BSD-3-Clause (its LICENSE presents both options). PyPI reports the imprecise Dual License classifier and the deep scan joins the license texts. This project-level clarify supersedes the tool builtin whose expects guard predates the PEP 639 observation."

