name: Production

on:
  push:
    branches:
      - production

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  tests:
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/tests.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: tests
    uses: ./.github/workflows/deploy_collimator.yml
    with:
      environment: production

      aws_region: ${{ vars.PROD_AWS_REGION }}

      ecr_registry_uri: ${{ vars.PROD_ECR_REGISTRY_URI }}

      role_to_assume: ${{ vars.PROD_ROLE_TO_ASSUME }}

      deploy_url: ${{ vars.PROD_DEPLOY_URL }}

      entra_id_client_id: ${{ vars.PROD_ENTRA_ID_CLIENT_ID }}

      backend_image_name: collimator-prod-backend
      frontend_bucket_id: collimator-prod-static-frontend
      scratch_app_bucket_id: collimator-prod-app-scratch
      jupyter_app_bucket_id: collimator-prod-app-jupyter

      terraform_state_bucket: collimator-prod-cd-tf-state

      ecs_cluster: collimator-prod-backend
      ecs_service: collimator-prod-backend

      sentry_environment: production
      frontend_sentry_dsn: ${{ vars.PROD_FRONTEND_SENTRY_DSN }}
      scratch_app_sentry_dsn: ${{ vars.PROD_APP_SCRATCH_SENTRY_DSN }}
      
    secrets:
      FRONTEND_SENTRY_AUTH_TOKEN: ${{ secrets.PROD_FRONTEND_SENTRY_AUTH_TOKEN }}
      APP_SCRATCH_SENTRY_AUTH_TOKEN: ${{ secrets.PROD_APP_SCRATCH_SENTRY_AUTH_TOKEN }}
      APP_JUPYTER_SENTRY_AUTH_TOKEN: ${{ secrets.PROD_APP_JUPYTER_SENTRY_AUTH_TOKEN }}
      BACKEND_SENTRY_AUTH_TOKEN: ${{ secrets.PROD_BACKEND_SENTRY_AUTH_TOKEN }}
